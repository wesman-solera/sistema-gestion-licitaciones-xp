# ---------------------------------------------------------------------------------------------
# Orquestacion local del Sistema de Gestion de Licitaciones.
#
# Un solo comando levanta la solucion completa:
#
#     cp .env.example .env
#     docker compose up --build
#
# La aplicacion aplica sus propias migraciones al arrancar y reintenta mientras PostgreSQL
# termina de aceptar conexiones, de modo que no hacen falta pasos manuales intermedios.
# ---------------------------------------------------------------------------------------------

name: licitaciones-xp

services:
  postgres:
    image: postgres:16-alpine
    container_name: licitaciones-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licitaciones}
      POSTGRES_USER: ${POSTGRES_USER:-licitaciones_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
      # Fija la configuracion regional del cluster para que los ordenamientos de texto sean
      # estables entre entornos.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # Volumen con nombre: los datos sobreviven a "docker compose down" y al reinicio de los
      # contenedores, que es justo lo que la seccion 13.1 pide demostrar.
      - datos_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licitaciones_app} -d ${POSTGRES_DB:-licitaciones}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - licitaciones

  aplicacion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: licitaciones-aplicacion
    restart: unless-stopped
    depends_on:
      postgres:
        # No basta con que el contenedor exista: debe estar aceptando conexiones.
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      TZ: America/Costa_Rica
      # La cadena de conexion llega por variable de entorno. El repositorio no contiene
      # credenciales reales (seccion 11).
      ConnectionStrings__Licitaciones: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-licitaciones};Username=${POSTGRES_USER:-licitaciones_app};Password=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/vivo || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - licitaciones

volumes:
  datos_postgres:
    name: licitaciones_datos_postgres

networks:
  licitaciones:
    name: licitaciones_red
    driver: bridge
