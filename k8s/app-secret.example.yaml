# ---------------------------------------------------------------------------------------------
# PLANTILLA de secretos. Este archivo SI se versiona; el archivo real NO.
#
# El repositorio no puede contener credenciales reales (secciones 11 y 14.2). Genere el secreto
# real fuera del control de versiones:
#
#   kubectl create secret generic licitaciones-secret \
#     --namespace licitaciones \
#     --from-literal=POSTGRES_USER='licitaciones_app' \
#     --from-literal=POSTGRES_PASSWORD='<clave-fuerte>' \
#     --from-literal=ConnectionStrings__Licitaciones='Host=licitaciones-postgres;Port=5432;Database=licitaciones;Username=licitaciones_app;Password=<clave-fuerte>'
#
# El archivo k8s/app-secret.yaml esta excluido en .gitignore para que una copia con valores
# reales no llegue nunca al repositorio por accidente.
# ---------------------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: licitaciones-secret
  namespace: licitaciones
  labels:
    app.kubernetes.io/name: licitaciones
type: Opaque
stringData:
  POSTGRES_USER: "REEMPLAZAR"
  POSTGRES_PASSWORD: "REEMPLAZAR"
  ConnectionStrings__Licitaciones: "Host=licitaciones-postgres;Port=5432;Database=licitaciones;Username=REEMPLAZAR;Password=REEMPLAZAR"
